<style>
  :root {
    color-scheme: light;
    --bg: #f9fafb; --surface: #f3f4f6; --card: #ffffff; --text: #111827;
    --text-secondary: #374151; --text-muted: #9ca3af; --border: #e5e7eb; --border-strong: #d1d5db;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --surface: #1a1d23; --card: #1a1d23; --text: #e5e7eb;
    --text-secondary: #cbd5e1; --text-muted: #7d8590; --border: #2a2e37; --border-strong: #3a3f4b;
  }
  * { box-sizing: border-box; color: var(--text); -webkit-text-fill-color: var(--text); }
  html, body { background: var(--bg) !important; overflow-x: hidden; max-width: 100vw; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 16px;
    color: var(--text);
  }
  .wrap { max-width: 480px; margin: 0 auto; overflow-x: hidden; }
  h1 { font-size: 16px; font-weight: 500; margin: 0; }
  .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .theme-toggle { width: auto; font-size: 15px; padding: 6px 9px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 8px; padding: 4px; margin: 16px 0; }
  .tab { flex: 1; text-align: center; font-size: 14px; padding: 6px 0; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; }
  .tab.active { background: var(--card); font-weight: 500; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
  .card-btn { display: block; width: 100%; text-align: left; cursor: pointer; }
  .card-btn:hover { border-color: #93c5fd; }
  input, select, textarea { width: 100%; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; font-family: inherit; background: var(--card); color: var(--text); -webkit-text-fill-color: var(--text); }
  textarea { resize: vertical; min-height: 60px; }
  .btn { font-size: 14px; padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; }
  .btn-primary { background: #111827; color: white; -webkit-text-fill-color: white; flex: 1; }
  .btn-blue { background: #2563eb; color: white; -webkit-text-fill-color: white; flex: 1; }
  .btn-ghost { background: transparent; color: var(--text-muted); -webkit-text-fill-color: var(--text-muted); }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .q-block { margin-bottom: 14px; }
  .q-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
  .q-help { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; line-height: 1.5; }
  .bool-row { display: flex; gap: 8px; }
  .bool-btn { flex: 1; padding: 7px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--card); font-size: 14px; cursor: pointer; color: var(--text); -webkit-text-fill-color: var(--text); }
  .bool-btn.selected { background: #2563eb; color: white; -webkit-text-fill-color: white; border-color: #2563eb; }
  .progress { display: flex; gap: 4px; margin-bottom: 20px; }
  .progress div { height: 4px; flex: 1; border-radius: 2px; background: var(--border); }
  .progress div.active { background: #3b82f6; }
  .checkbox-row { position: relative; display: block; font-size: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px 9px 34px; margin-bottom: 6px; }
  .checkbox-row input { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; margin: 0; }
  .checkbox-row span { display: block; overflow-wrap: break-word; word-break: break-word; }
  .card, .card-btn, .list-item-name, .q-text, .q-help { overflow-wrap: break-word; word-break: break-word; }
  .checkbox-row .sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .pill { display: inline-block; background: #eff6ff; color: #1e40af; -webkit-text-fill-color: #1e40af; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin: 0 4px 4px 0; }
  /* Selve erklæringen holder seg alltid lys — den representerer et fysisk papirdokument */
  .doc-card { background: #ffffff; color: #111827; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; font-size: 13px; line-height: 1.5; max-width: 420px; margin: 0 auto; }
  .doc-card, .doc-card * { color: #111827; -webkit-text-fill-color: #111827; }
  .doc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .doc-title { text-align: center; font-size: 14px; font-weight: 500; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 12px; }
  .doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .doc-box { background: #f9fafb; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .doc-label { font-size: 10px; color: #9ca3af; -webkit-text-fill-color: #9ca3af; margin-bottom: 2px; }
  .doc-disclaimer { font-size: 10px; color: #9ca3af; -webkit-text-fill-color: #9ca3af; border-top: 1px dashed #e5e7eb; border-bottom: 1px dashed #e5e7eb; padding: 8px 0; margin-bottom: 10px; }
  .doc-sign { display: flex; justify-content: space-between; align-items: flex-end; }
  .sign-line { width: 80px; height: 32px; border-bottom: 1px solid #d1d5db; }
  .lang-toggle { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 10px; }
  .lang-btn { font-size: 11px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; }
  .lang-btn.active { background: var(--surface); }
  .print-btn { font-size: 11px; padding: 4px 12px; border-radius: 6px; border: none; background: #111827; color: white; -webkit-text-fill-color: white; cursor: pointer; }
  .empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 0; }
  .list-item-top { display: flex; justify-content: space-between; align-items: center; }
  .list-item-name { font-size: 14px; font-weight: 500; }
  .list-item-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .search-result { display: block; width: 100%; text-align: left; font-size: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin-bottom: 4px; cursor: pointer; }
  .warn { font-size: 12px; color: #d97706; margin-top: 4px; }
  @media print {
    .no-print { display: none !important; }
    body { background: white; padding: 0; }
    .wrap { max-width: 100% !important; }
    .doc-card { border: none; max-width: 650px; margin: 0 auto; zoom: 1.4; }
    @page { margin: 15mm; }
  }
</style>
</head>
<body>
<div id="boot-loading" style="display:flex; align-items:center; justify-content:center; height:100vh; font-size:13px; color:#9ca3af; flex-direction:column; gap:12px; text-align:center; padding:0 24px;">
  <div id="boot-loading-text">Laster…</div>
  <div id="boot-error" style="display:none; color:#dc2626; font-size:12px; max-width:320px; word-break:break-word;"></div>
  <button id="boot-reload-btn" onclick="window.location.reload(true)" style="display:none; padding:10px 20px; background:#111827; color:white; border:none; border-radius:8px; font-size:13px; cursor:pointer;">🔄 Last inn på nytt</button>
</div>
<script>
  window.onerror = function(msg, src, line, col, err) {
    var e = document.getElementById("boot-error");
    var b = document.getElementById("boot-reload-btn");
    var t = document.getElementById("boot-loading-text");
    if (e && e.offsetParent !== null) {
      e.style.display = "block"; e.textContent = "Feil: " + msg + " (linje " + line + ")";
      if (b) b.style.display = "inline-block";
      if (t) t.textContent = "Noe gikk galt under lasting";
    } else {
      alert("Feil: " + msg + " (linje " + line + ")");
    }
    return false;
  };
  window.addEventListener("unhandledrejection", function(ev) {
    var reason = ev.reason;
    var msg = (reason && (reason.message || reason.code)) ? (reason.code ? reason.code + ": " + reason.message : reason.message) : String(reason);
    alert("Uventet feil: " + msg);
  });
  setTimeout(function() {
    var root = document.getElementById("boot-loading");
    if (root && root.style.display !== "none") {
      var b = document.getElementById("boot-reload-btn");
      var t = document.getElementById("boot-loading-text");
      if (t) t.textContent = "Tar lengre tid enn vanlig…";

    "cat_other": "Otro / no configurado",
    "attrq_atex": "¿Se utilizará el equipo en una atmósfera potencialmente explosiva?",
    "attrh_atex": "Se aplica a zonas clasificadas como zona Ex (riesgo de explosión por gas o polvo), típicamente cerca del flujo del pozo, combustible u otras sustancias inflamables en una instalación. Una sala de máquinas normal sin dicha clasificación no activa ATEX.",
    "attrq_atexGroup": "Grupo de equipo / categoría",
    "attrh_atexGroup": "El grupo I es minería (rara vez relevante en alta mar). El grupo II es \"superficie\"/la mayoría de instalaciones industriales. La categoría la determina la zona en la que se colocará el equipo — consulte el mapa de zonas de la instalación; si la categoría es incierta, debe aclararse con el cliente/proyecto, no adivinarse.",
    "opt_II2G": "Grupo II, categoría 2 (gas)",
    "opt_II3G": "Grupo II, categoría 3 (gas)",
    "opt_II2D": "Grupo II, categoría 2 (polvo)",
    "attrq_electrical": "¿Contiene el producto componentes eléctricos/electrónicos?",
    "attrh_electrical": "Incluye motores, sensores, armarios de control, cableado — todo lo que consume o controla electricidad. Las piezas puramente mecánicas/hidráulicas sin interfaz eléctrica no activan esto.",
    "attrq_pressure": "¿Tiene el producto partes presurizadas con PS superior a 0,5 bar?",
    "attrh_pressure": "PS = presión máxima admisible. Por debajo de 0,5 bar, la Directiva de Equipos a Presión (PED) no es relevante en absoluto. Por encima de 0,5 bar, la categoría se determina por PS × volumen (recipientes) o PS × diámetro (tuberías), y el grupo de fluido (aceite hidráulico/aire/agua = grupo 2, inflamable/tóxico/oxidante = grupo 1 con requisitos más estrictos). Normalmente relevante para acumuladores, no para el circuito de aceite en sí. ¿No está seguro de las cifras? Consulte la ficha técnica del componente — no adivine.",
    "attrq_hydraulic": "¿Contiene el producto hidráulica?",
    "attrh_hydraulic": "Cilindros, bombas, válvulas, mangueras a presión accionadas por aceite hidráulico. Los sistemas puramente eléctricos o neumáticos sin hidráulica de aceite no activan esto.",
    "attrq_liftingPersons": "¿El equipo eleva personas?",
    "attrh_liftingPersons": "El transporte/elevación de personas (p. ej. una cesta de personal) está sujeto a los requisitos más estrictos del Anexo IV de la Directiva de Máquinas (alto riesgo), independientemente de la carga. La elevación de carga pura, aunque sea pesada, no es lo mismo.",
    "attrq_offshore": "¿Se instalará el producto en una instalación offshore de petróleo/gas (fija o móvil)?",
    "attrh_offshore": "\"Fija o móvil\" no es una decisión que deba tomar — la serie IEC 61892 cubre ambas conjuntamente. No se aplica a buques ordinarios — vea la pregunta separada abajo. No se marca automáticamente: busque la parte correcta (1=general, 2=diseño del sistema, 3=equipos, 4=cables, 6=instalación, 7=áreas Ex) en la búsqueda de normas de abajo, según lo que realmente sea el producto.",
    "attrq_vessel": "¿Se instalará el producto en un buque ordinario (no una instalación de petróleo/gas)?",
    "attrh_vessel": "Se aplica a buques de servicio, acuicultura y otros clasificados por una sociedad de clasificación (DNV, etc.), no a instalaciones petrolíferas. Activa la serie IEC 60092 (eléctrica naval) en lugar de IEC 61892. No se marca automáticamente — busque la parte correcta según la función del producto.",

    "cat_hpu": "Groupe hydraulique (HPU)",

    "cat_other": "Autre / non configuré",
    "attrq_atex": "L'équipement sera-t-il utilisé dans une atmosphère potentiellement explosive ?",
    "attrh_atex": "S'applique aux zones classées comme zone Ex (risque d'explosion de gaz ou de poussière), typiquement à proximité de l'écoulement du puits, de carburant ou d'autres substances inflammables sur une installation. Une salle des machines normale sans cette classification ne déclenche pas ATEX.",
    "attrq_atexGroup": "Groupe d'équipement / catégorie",
    "attrh_atexGroup": "Le groupe I concerne les mines (rarement pertinent en mer). Le groupe II concerne la « surface »/la plupart des installations industrielles. La catégorie est déterminée par la zone où l'équipement sera placé — consultez le plan de zonage de l'installation ; une catégorie incertaine doit être clarifiée avec le client/projet, pas devinée.",
    "opt_II2G": "Groupe II, catégorie 2 (gaz)",
    "opt_II3G": "Groupe II, catégorie 3 (gaz)",
    "opt_II2D": "Groupe II, catégorie 2 (poussière)",
    "attrq_electrical": "Le produit contient-il des composants électriques/électroniques ?",
    "attrh_electrical": "Concerne les moteurs, capteurs, armoires de commande, câblage — tout ce qui consomme ou commande de l'électricité. Les pièces purement mécaniques/hydrauliques sans interface électrique ne déclenchent pas ceci.",
    "attrq_pressure": "Le produit comporte-t-il des parties sous pression avec PS supérieure à 0,5 bar ?",
    "attrh_pressure": "PS = pression maximale admissible. En dessous de 0,5 bar, la directive équipements sous pression (DESP) n'est pas du tout pertinente. Au-dessus de 0,5 bar, la catégorie est déterminée par PS × volume (récipients) ou PS × diamètre (tuyauteries), ainsi que le groupe de fluide (huile hydraulique/air/eau = groupe 2, inflammable/toxique/oxydant = groupe 1 avec exigences plus strictes). Généralement pertinent pour les accumulateurs, pas pour le circuit d'huile lui-même. Incertain sur les chiffres ? Consultez la fiche technique du composant — ne devinez pas.",
    "attrq_hydraulic": "Le produit contient-il de l'hydraulique ?",
    "attrh_hydraulic": "Vérins, pompes, vannes, flexibles sous pression entraînés par huile hydraulique. Les systèmes purement électriques ou pneumatiques sans hydraulique à huile ne déclenchent pas ceci.",
    "attrq_liftingPersons": "L'équipement soulève-t-il des personnes ?",
    "attrh_liftingPersons": "Le transport/levage de personnes (p. ex. une nacelle) relève des exigences plus strictes de l'annexe IV de la directive Machines (haut risque), quelle que soit la charge. Le levage de charge pur, même lourd, n'est pas la même chose.",
    "attrq_offshore": "Le produit sera-t-il installé sur une installation offshore pétrole/gaz (fixe ou mobile) ?",
    "attrh_offshore": "« Fixe ou mobile » n'est pas un choix à faire — la série IEC 61892 couvre les deux ensemble. Ne s'applique pas aux navires ordinaires — voir la question séparée ci-dessous. Non coché automatiquement : recherchez la bonne partie (1=général, 2=conception du système, 3=équipement, 4=câbles, 6=installation, 7=zones Ex) dans la recherche de normes ci-dessous, selon ce qu'est réellement le produit.",
    "attrq_vessel": "Le produit sera-t-il installé sur un navire ordinaire (pas une installation pétrole/gaz) ?",
    "attrh_vessel": "S'applique aux navires de service, d'aquaculture et autres classés par une société de classification (DNV, etc.), pas aux installations pétrolières. Déclenche la série IEC 60092 (électricité marine) au lieu de IEC 61892. Non coché automatiquement — recherchez la bonne partie selon la fonction du produit.",

// ---------- Theme ----------
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("theme-toggle-btn");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem("docpilot-theme", next);
  applyTheme(next);
}
function toggleSupport() {
  const panel = document.getElementById("support-panel");
  if (!panel) return;
  panel.style.display = panel.style.display === "none" ? "block" : "none";
  if (panel.style.display === "block") {
    panel.innerHTML = `<div style="margin-bottom:8px;"><a href="mailto:horgen.kenneth@gmail.com" style="color:var(--text); text-decoration:underline;">horgen.kenneth@gmail.com</a></div><div style="line-height:1.5;">${t("supportDisclaimer")}</div>`;
  }
}
function updateSupportBtnLabel() {
  const btn = document.getElementById("support-toggle-btn");
  if (btn) btn.textContent = t("supportBtn");
}
(function initTheme() {
  const stored = localStorage.getItem("docpilot-theme");
  if (stored === "dark" || stored === "light") { applyTheme(stored); return; }
  const systemPrefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(systemPrefersDark ? "dark" : "light");
})();

function suggestFor(categoryId, answers) {
  const directiveIds = new Set(), standardIds = new Set();
  RULES.forEach(r => {
    const catMatch = r.category === null || r.category === categoryId;
    const attrMatch = r.attr === null || answers[r.attr] === r.value;
    if (catMatch && attrMatch) r.suggests.forEach(s => (s.type === "directive" ? directiveIds : standardIds).add(s.id));
  });
  return { directiveIds: [...directiveIds], standardIds: [...standardIds] };

          <div class="doc-title" style="margin-top:8px;">${dt.title}</div>
          <div class="${isAtex ? 'doc-grid' : ''}">
            <div class="doc-box"><div class="doc-label">${dt.product}</div><div style="font-weight:500;">${esc(decl.productName) || "—"}</div>${decl.idType !== "type-only" && decl.serial ? `<div style="font-size:11px;color:#6b7280;">${decl.idType === "batch" ? "Batch" : "S/N"} ${esc(decl.serial)}</div>` : ""}</div>
            ${isAtex ? `<div class="doc-box"><div class="doc-label">${dt.ex}</div><div style="font-weight:500;">${esc(decl.exMarking) || "—"}</div></div>` : ""}
          </div>
        </div>
      </div>
      <div class="doc-box">
        <div class="doc-label">${dt.manufacturer}</div>
        <div>${esc(decl.manufacturerName) || "—"}${decl.manufacturerAddress ? ", " + esc(decl.manufacturerAddress) : ""}</div>
        <div style="font-size:11px;color:#9ca3af;margin-top:4px;">${dt.object}: ${esc(decl.object) || "—"}</div>
        ${(decl.directiveIds.includes("machine") || decl.directiveIds.includes("machine-reg")) && decl.techFileCompiler ? `<div style="font-size:11px;color:#9ca3af;margin-top:4px;">${dt.techFile}: ${esc(decl.techFileCompiler)}${decl.techFileAddress ? ", " + esc(decl.techFileAddress) : ""}</div>` : ""}
        <div style="margin-top:6px;padding-top:6px;border-top:1px solid #e5e7eb;font-size:11px;color:#6b7280;font-style:italic;">${dt.sole(decl.manufacturerName || "—")}</div>
      </div>
      <div class="doc-box">
        <div class="doc-label">${dt.conformity}</div>
        <div style="margin-bottom:4px;">${directives.map(d => `<span class="pill">${d.code}</span>`).join("")}</div>
        <div style="font-size:11px;color:#6b7280;">${dt.standards}: ${standards.map(s => s.code).join(" · ") || "—"}</div>
      </div>
      ${nb
        ? `<div class="doc-box"><div class="doc-label">${dt.nb}</div><div style="display:flex;justify-content:space-between;">${esc(nb.name)}<span style="color:#6b7280;">Nr. ${esc(nb.ref)}</span></div><div style="font-size:11px;color:#9ca3af;margin-top:2px;">${esc(decl.certNumber) || "—"}</div></div>`
        : ""}
      ${decl.additionalInfo ? `<div class="doc-box"><div class="doc-label">${dt.additionalInfo}</div><div style="font-size:12px;white-space:pre-wrap;">${esc(decl.additionalInfo)}</div></div>` : ""}
      <div class="doc-disclaimer">${dt.disclaimer(decl.manufacturerName || "—")}</div>
      <div class="doc-sign">
        <div>
          <div style="font-size:11px;color:#9ca3af;">${esc(decl.place || "Bergen")}, ${esc(decl.date)}</div>
          <div style="margin-top:14px;font-size:12px;">${esc(decl.signatoryName) || "—"}</div>
          <div style="font-size:11px;color:#6b7280;">${esc(decl.signatoryRole) || "—"}</div>
        </div>
        <div class="sign-line"></div>
      </div>
    </div>`;
}

// ---------- Wizard renderer ----------
function relevantAttrs() {
  const ids = CATEGORY_ATTRIBUTES[wz.categoryId] || [];
  return ATTRIBUTES.filter(a => ids.includes(a.id)).filter(a => !a.dependsOn || wz.answers[a.dependsOn.attr] === a.dependsOn.value);
}

function showNb() { return (wz.answers.atex === true && wz.answers.atexGroup === "II2G") || wz.details.nbManual === true; }

function renderWizard() {
  let html = `<div class="progress">${[1,2,3,4,5].map(n => `<div class="${wz.step >= n ? 'active' : ''}"></div>`).join("")}</div>`;

  if (wz.step === 1) {
    html += `<div class="section-title">${t("step1")}</div>`;
    CATEGORIES.forEach(c => {
      html += `<button class="card card-btn" onclick="selectCategory('${c.id}')">${esc(catName(c))}</button>`;
    });
    if (TEMPLATES.length > 0) {
      html += `<div class="section-title" style="margin-top:16px;">${t("orFromTemplate")}</div>`;
      TEMPLATES.forEach(tpl => {
        html += `<button class="card card-btn" onclick="useTemplate('${tpl.id}')">⭐ ${esc(tpl.name)}<div class="sub">${esc(catName(CATEGORIES.find(c => c.id === tpl.categoryId) || {id:tpl.categoryId,name:tpl.categoryId}))}</div></button>`;
      });
    }
  }

  if (wz.step === 2) {
    const cat = CATEGORIES.find(c => c.id === wz.categoryId);
    html += `<div class="section-title">${t("step2")} — ${esc(catName(cat))}</div>`;
    const attrs = relevantAttrs();
    if (attrs.length === 0) html += `<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">${t("noQuestionsForCategory")}</div>`;
    attrs.forEach(a => {
      html += `<div class="q-block"><div class="q-text">${esc(attrQ(a))}</div>`;
      if (a.help) html += `<div class="q-help">${esc(attrHelp(a))}</div>`;
      if (a.type === "bool") {
        html += `<div class="bool-row">
          <button class="bool-btn ${wz.answers[a.id] === true ? 'selected' : ''}" onclick="answerBool('${a.id}', true)">${t("yes")}</button>
          <button class="bool-btn ${wz.answers[a.id] === false ? 'selected' : ''}" onclick="answerBool('${a.id}', false)">${t("no2")}</button>
        </div>`;
      } else {
        html += `<select onchange="answerSelect('${a.id}', this.value)">
          <option value="">${t("choose")}</option>
          ${a.options.map(o => `<option value="${o.value}" ${wz.answers[a.id] === o.value ? "selected" : ""}>${esc(optLabel(o))}</option>`).join("")}
        </select>`;
      }
      html += `</div>`;
    });
    html += `<div class="row"><button class="btn btn-ghost" onclick="backToCategoryStep()">${t("back")}</button>
      <button class="btn btn-primary" onclick="runSuggest()">${t("suggest")}</button></div>`;
  }

  if (wz.step === 3) {
    html += `<div class="section-title">${t("step3")}</div><div class="section-title">${t("directives")}</div>`;
    allDirectives().forEach(d => {
      const checked = wz.directiveIds.includes(d.id);
      html += `<label class="checkbox-row"><input type="checkbox" ${checked ? "checked" : ""} onchange="toggleDirective('${d.id}')"><span>${d.code} — ${esc(dirName(d))}</span></label>`;
    });
    html += `<button class="search-result" onclick="wz.showAddDirective=!wz.showAddDirective; render()">${wz.showAddDirective ? t("close") : t("addOwnDirective")}</button>`;
    if (wz.showAddDirective) {
      html += `<input placeholder="${t("codePh")}" value="${esc(wz.newDirectiveCode || "")}" oninput="wz.newDirectiveCode=this.value">`;
      html += `<input placeholder="${t("namePh")}" value="${esc(wz.newDirectiveName || "")}" oninput="wz.newDirectiveName=this.value">`;
      html += `<button class="btn btn-ghost" style="width:100%;text-align:left;padding-left:0;" onclick="addCustomDirective()">${t("addDirectiveBtn")}</button>`;
    }

    html += `<div class="section-title" style="margin-top:12px;">${t("standards")}</div>`;
    allStandards().filter(s => wz.standardIds.includes(s.id)).forEach(s => {
      html += `<label class="checkbox-row"><input type="checkbox" checked onchange="toggleStandard('${s.id}')"><span>${s.code} — ${esc(stdTitle(s))}<div class="sub">${t("edition")} ${esc(s.edition)} · ${t("verifiedOn")} ${esc(s.lastVerified)}</div></span></label>`;
    });
    html += `<input id="standard-search-input" placeholder="${t("searchStandards")}" value="${esc(wz.addSearch)}" oninput="updateStandardSearch(this.value)">`;
    html += `<div id="standard-search-results">${renderStandardSearchResults()}</div>`;
    html += `<button class="search-result" onclick="wz.showAddStandard=!wz.showAddStandard; render()">${wz.showAddStandard ? t("close") : t("addOwnStandard")}</button>`;
    if (wz.showAddStandard) {
      html += `<input placeholder="${t("codeStdPh")}" value="${esc(wz.newStandardCode || "")}" oninput="wz.newStandardCode=this.value">`;
      html += `<input placeholder="${t("titlePh")}" value="${esc(wz.newStandardTitle || "")}" oninput="wz.newStandardTitle=this.value">`;
      html += `<input placeholder="${t("editionPh")}" value="${esc(wz.newStandardEdition || "")}" oninput="wz.newStandardEdition=this.value">`;
      html += `<button class="btn btn-ghost" style="width:100%;text-align:left;padding-left:0;" onclick="addCustomStandard()">${t("addStandardBtn")}</button>`;
    }
    html += `<div class="row"><button class="btn btn-ghost" onclick="goStep(2)">${t("back")}</button>
      <button class="btn btn-primary" onclick="goStep(4)">${t("next")}</button></div>`;
  }

  if (wz.step === 4) {
    html += `<div class="section-title">${t("step4")}</div>`;
    html += `<div class="q-block"><div class="q-text">${t("logoOptional")}</div>`;
    if (wz.details.logo) {
      html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;"><img src="${wz.details.logo}" style="max-height:40px;max-width:160px;object-fit:contain;"><button class="btn btn-ghost" style="padding:4px 10px;" onclick="wz.details.logo=''; render()">${t("remove")}</button></div>`;
    } else {
      html += `<div id="logo-dropzone" ondragover="event.preventDefault(); this.style.borderColor='#3b82f6'; this.style.background='var(--surface)';" ondragleave="this.style.borderColor='var(--border)'; this.style.background='transparent';" ondrop="handleLogoDrop(event)" onclick="document.getElementById('logo-file-input').click()" style="border:1px dashed var(--border); border-radius:6px; padding:20px 10px; text-align:center; cursor:pointer; font-size:12px; color:var(--text-muted); margin-bottom:8px;">${t("dropLogoHere")}</div>
        <input id="logo-file-input" type="file" accept="image/*" onchange="handleLogoUpload(this)" style="display:none;">`;
    }
    html += `</div>`;
    html += field("manufacturerName", t("manufacturerName"));
    html += field("manufacturerAddress", t("manufacturerAddress"));
    if (wz.directiveIds.includes("machine") || wz.directiveIds.includes("machine-reg")) {
      html += `<div class="q-help" style="margin-bottom:8px;">${t("techFileNote")}</div>`;
      html += field("techFileCompiler", t("techFileName"));
      html += field("techFileAddress", t("techFileAddress"));
    }
    html += field("productName", t("productModel"));
    html += `<select onchange="wz.details.idType=this.value; render()" style="margin-bottom:8px;">
      <option value="serial" ${wz.details.idType !== "batch" && wz.details.idType !== "type-only" ? "selected" : ""}>${t("idSerial")}</option>
      <option value="batch" ${wz.details.idType === "batch" ? "selected" : ""}>${t("idBatch")}</option>
      <option value="type-only" ${wz.details.idType === "type-only" ? "selected" : ""}>${t("idTypeOnly")}</option>
    </select>`;
    if (wz.details.idType !== "type-only") {
      html += field("serial", wz.details.idType === "batch" ? t("batchNumber") : t("serialNumber"));
    }
    html += field("object", t("objectDesc"));
    html += field("exMarking", t("exMarking"));
    html += `<textarea maxlength="300" placeholder="${t("additionalInfo")}" oninput="wz.details.additionalInfo=this.value">${esc(wz.details.additionalInfo || "")}</textarea>`;
    const nbAuto = wz.answers.atex === true && wz.answers.atexGroup === "II2G";
    if (!nbAuto) {
      html += `<label class="checkbox-row"><input type="checkbox" ${wz.details.nbManual ? "checked" : ""} onchange="wz.details.nbManual=this.checked; render()"><span>${t("nbManualLabel")}</span></label>`;
    }
    if (showNb()) {
      html += `<select onchange="wz.details.notifiedBodyId=this.value">
        <option value="">${t("selectNotifiedBody")}</option>
        ${NOTIFIED_BODIES.map(n => `<option value="${n.id}" ${wz.details.notifiedBodyId === n.id ? "selected" : ""}>${n.name} (${n.ref})</option>`).join("")}
      </select>`;
      html += field("certNumber", t("certNumber"));
    }
    html += field("signatoryName", t("signatoryName"));
    html += field("signatoryRole", t("signatoryRole"));
    html += field("place", t("place"));
    html += `<div class="row"><button class="btn btn-ghost" onclick="goStep(3)">${t("back")}</button>
      <button class="btn btn-primary" onclick="goStep(5)">${t("preview")}</button></div>`;
  }

  if (wz.step === 5) {
    html += `<div class="section-title">${t("step5")}</div>`;
    const decl = { docNumber: newDocNumber(), directiveIds: wz.directiveIds, standardIds: wz.standardIds,
      notifiedBody: showNb() && wz.details.notifiedBodyId ? NOTIFIED_BODIES.find(n => n.id === wz.details.notifiedBodyId) : null,
      date: new Date().toLocaleDateString("no-NO"), ...wz.details };
    html += renderDoc(decl, wz.lang, { onLang: "setWizardLang" });
    html += `<div class="row" style="max-width:420px;margin-left:auto;margin-right:auto;">
      <button class="btn btn-ghost" onclick="goStep(4)">${t("back")}</button>
      <button class="btn btn-blue" onclick="saveDeclaration()">${t("saveDraft")}</button></div>
      <div style="max-width:420px;margin:10px auto 0;">
        <button class="btn" style="width:100%; background:var(--surface); border:1px dashed var(--border-strong); color:var(--text);" onclick="saveAsTemplate()">${t("saveAsTemplate")}</button>
        <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${t("sharedLibraryNote")}</div>
      </div>`;
  }

  if (wz.step === 5.5) {
    html += `<div class="empty">${t("savedDraft")}<br><br>
      <button class="btn btn-primary" style="max-width:200px;" onclick="resetWizard(); render()">${t("newDeclaration")}</button></div>`;
  }

  return html;
}

function field(key, placeholder) {
  return `<input placeholder="${placeholder}" value="${esc(wz.details[key])}" oninput="wz.details.${key}=this.value">`;
}

// ---------- Event handlers (wizard) ----------
function selectCategory(id) { wz.categoryId = id; wz.answers = {}; wz.step = 2; render(); }
function saveAsTemplate() {
  const name = prompt(t("templateNamePrompt"));
  if (!name || !name.trim()) return;
  const tpl = {
    id: "tpl" + Date.now(), name: name.trim(), categoryId: wz.categoryId,
    answers: { ...wz.answers }, directiveIds: [...wz.directiveIds], standardIds: [...wz.standardIds],
    details: {
      manufacturerName: wz.details.manufacturerName || "", manufacturerAddress: wz.details.manufacturerAddress || "",
      techFileCompiler: wz.details.techFileCompiler || "", techFileAddress: wz.details.techFileAddress || "",
      exMarking: wz.details.exMarking || "", notifiedBodyId: wz.details.notifiedBodyId || "",
      nbManual: !!wz.details.nbManual, certNumber: wz.details.certNumber || "",
      signatoryName: wz.details.signatoryName || "", signatoryRole: wz.details.signatoryRole || "", place: wz.details.place || "",
    },
  };
  TEMPLATES = [tpl, ...TEMPLATES];
  persistTemplates();
  alert(t("templateSaved"));
}
function useTemplate(id) {
  const tpl = TEMPLATES.find(x => x.id === id);
  if (!tpl) return;
  wz.categoryId = tpl.categoryId;
  wz.answers = { ...tpl.answers };
  wz.directiveIds = [...tpl.directiveIds];
  wz.standardIds = [...tpl.standardIds];
  wz.editingId = null; wz.editingDocNumber = null;
  wz.details = {
    manufacturerName: tpl.details.manufacturerName || "", manufacturerAddress: tpl.details.manufacturerAddress || "",
    techFileCompiler: tpl.details.techFileCompiler || "", techFileAddress: tpl.details.techFileAddress || "",
    productName: "", serial: "", object: "", exMarking: tpl.details.exMarking || "",
    notifiedBodyId: tpl.details.notifiedBodyId || "", nbManual: !!tpl.details.nbManual, certNumber: tpl.details.certNumber || "",
    signatoryName: tpl.details.signatoryName || "", signatoryRole: tpl.details.signatoryRole || "", place: tpl.details.place || "",
    idType: "serial", logo: "",
  };
  wz.step = 3;
  render();
}
function deleteTemplate(id) {
  if (!confirm(t("deleteTemplateConfirm"))) return;
  TEMPLATES = TEMPLATES.filter(x => x.id !== id);
  persistTemplates();
  render();
}
function handleLogoUpload(input) {
  const file = input.files && input.files[0];
  if (file) readLogoFile(file);
}
function handleLogoDrop(event) {
  event.preventDefault();
  const zone = document.getElementById("logo-dropzone");
  if (zone) { zone.style.borderColor = "var(--border)"; zone.style.background = "transparent"; }
  const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
  if (file) readLogoFile(file);
}
function readLogoFile(file) {
  if (!file.type || !file.type.startsWith("image/")) { alert(t("notAnImage")); return; }
  const reader = new FileReader();
  reader.onload = e => { wz.details.logo = e.target.result; render(); };
  reader.readAsDataURL(file);
}
function goStep(n) { wz.step = n; render(); }
function backToCategoryStep() {
  const hasAnswers = Object.keys(wz.answers).length > 0;
  if (hasAnswers && !confirm(t("changeCategoryConfirm"))) return;
  wz.answers = {};
  wz.step = 1;
  render();
}
function answerBool(id, val) { wz.answers[id] = val; render(); }
function answerSelect(id, val) { wz.answers[id] = val; render(); }
function runSuggest() {
  const s = suggestFor(wz.categoryId, wz.answers);
  wz.directiveIds = s.directiveIds; wz.standardIds = s.standardIds; wz.step = 3; render();
}
function toggleDirective(id) { wz.directiveIds = wz.directiveIds.includes(id) ? wz.directiveIds.filter(x => x !== id) : [...wz.directiveIds, id]; render(); }
function toggleStandard(id) { wz.standardIds = wz.standardIds.includes(id) ? wz.standardIds.filter(x => x !== id) : [...wz.standardIds, id]; render(); }
function renderStandardSearchResults() {
  if (!wz.addSearch) return "";
  const results = allStandards().filter(s => !wz.standardIds.includes(s.id) && (s.code.toLowerCase().includes(wz.addSearch.toLowerCase()) || s.title.toLowerCase().includes(wz.addSearch.toLowerCase())));
  let html = "";
  results.slice(0, 4).forEach(s => {
    html += `<button class="search-result" onclick="addStandard('${s.id}')">+ ${esc(s.code)} — ${esc(s.title)}</button>`;
  });
  if (results.length === 0) {
    html += `<div style="font-size:12px;color:#9ca3af;margin-bottom:6px;">Ingen treff i biblioteket. Bruk "Legg til egen standard" under.</div>`;
  }
  return html;
}
function updateStandardSearch(value) {
  wz.addSearch = value;
  const el = document.getElementById("standard-search-results");
  if (el) el.innerHTML = renderStandardSearchResults();
}
function addStandard(id) { wz.standardIds.push(id); render(); }
function addCustomStandard() {
  if (!wz.newStandardCode) return;
  const id = "custom-" + Date.now();
  CUSTOM_STANDARDS.push({ id, code: wz.newStandardCode, title: wz.newStandardTitle || "", edition: wz.newStandardEdition || "—", lastVerified: "egendefinert" });
  wz.standardIds.push(id);
  wz.newStandardCode = ""; wz.newStandardTitle = ""; wz.newStandardEdition = ""; wz.showAddStandard = false;
  persistCustomLibrary();
  render();
}
function addCustomDirective() {
  if (!wz.newDirectiveCode) return;
  const id = "custom-" + Date.now();
  CUSTOM_DIRECTIVES.push({ id, code: wz.newDirectiveCode, name: wz.newDirectiveName || "" });
  wz.directiveIds.push(id);
  wz.newDirectiveCode = ""; wz.newDirectiveName = ""; wz.showAddDirective = false;
  persistCustomLibrary();
  render();
}
function setWizardLang(l) { wz.lang = l; render(); }
function saveDeclaration() {
  if (!wz.details.manufacturerName || !wz.details.productName) {
    alert(t("validationError"));
    return;
  }
  const decl = { id: wz.editingId || ("d" + Date.now()), docNumber: wz.editingDocNumber || newDocNumber(), categoryId: wz.categoryId,
    directiveIds: wz.directiveIds, standardIds: wz.standardIds,
    notifiedBody: showNb() && wz.details.notifiedBodyId ? NOTIFIED_BODIES.find(n => n.id === wz.details.notifiedBodyId) : null,
    date: new Date().toLocaleDateString("no-NO"), status: "utkast", ...wz.details };
  if (wz.editingId) {
    declarations = declarations.map(d => d.id === wz.editingId ? decl : d);
  } else {
    declarations = [decl, ...declarations];
  }
  persist();
  wz.step = 5.5; render();
}
function editDeclaration(id) {
  const d = declarations.find(x => x.id === id);
  if (!d) return;
  const nb = NOTIFIED_BODIES.find(n => d.notifiedBody && n.name === d.notifiedBody.name && n.ref === d.notifiedBody.ref);
  wz.categoryId = d.categoryId;
  wz.directiveIds = [...d.directiveIds];
  wz.standardIds = [...d.standardIds];
  wz.answers = {};
  wz.editingId = d.id;
  wz.editingDocNumber = d.docNumber;
  wz.details = { manufacturerName: d.manufacturerName || "", manufacturerAddress: d.manufacturerAddress || "",
    techFileCompiler: d.techFileCompiler || "", techFileAddress: d.techFileAddress || "",
    productName: d.productName || "", serial: d.serial || "", object: d.object || "", exMarking: d.exMarking || "", additionalInfo: d.additionalInfo || "",
    notifiedBodyId: nb ? nb.id : "", nbManual: !!d.notifiedBody, certNumber: d.certNumber || "",
    signatoryName: d.signatoryName || "", signatoryRole: d.signatoryRole || "", place: d.place || "",
    idType: d.idType || "serial", logo: d.logo || "" };
  wz.lang = "no";
  wz.step = 3;
  viewing = null;
  tab = "new";
  render();
}
function deleteDeclaration(id) {
  if (!confirm(t("deleteConfirm"))) return;
  declarations = declarations.filter(d => d.id !== id);
  persist();
  viewing = null;
  render();
}

// ---------- List & library ----------
function renderList() {
  if (viewing) {
    const decl = declarations.find(d => d.id === viewing);
    return `<div class="row" style="margin-top:0;">
        <button class="btn btn-ghost no-print" style="padding-left:0;" onclick="viewing=null; render()">${t("backToList")}</button>
        <button class="btn btn-ghost no-print" onclick="editDeclaration('${decl.id}')">${t("editBtn")}</button>
        <button class="btn btn-ghost no-print" style="color:#dc2626;" onclick="deleteDeclaration('${decl.id}')">${t("deleteBtn")}</button>
      </div>` +
      renderDoc(decl, viewLang, { onLang: "setViewLang" });
  }
  if (declarations.length === 0) return `<div class="empty">${t("noDeclarationsYet")}</div>`;
  return declarations.map(d => `
    <button class="card card-btn" onclick="viewing='${d.id}'; render()">
      <div class="list-item-top"><span class="list-item-name">${esc(d.productName) || t("unnamed")}</span><span style="font-size:11px;color:var(--text-muted);">${esc(d.docNumber)}</span></div>
      <div class="list-item-meta">${esc(d.date)} · ${esc(d.status)} · ${d.directiveIds.length} ${t("directivesLower")}, ${d.standardIds.length} ${t("standardsLower")}</div>
    </button>`).join("");
}
function setViewLang(l) { viewLang = l; render(); }

function renderLibrary() {
  let html = `<div class="q-help" style="margin-bottom:12px;">${t("sharedLibraryNote")}</div>`;
  if (TEMPLATES.length > 0) {
    html += `<div class="section-title">${t("favorites")}</div>`;
    TEMPLATES.forEach(tpl => {
      html += `<div class="card list-item-top"><span>⭐ ${esc(tpl.name)}</span><button class="btn btn-ghost" style="width:auto;padding:2px 8px;color:#dc2626;" onclick="deleteTemplate('${tpl.id}')">${t("deleteBtn")}</button></div>`;
    });
  }
  html += `<div class="section-title" style="margin-top:12px;">${t("standardLibrary")}</div>`;
  allStandards().forEach(s => {
    const warn = s.lastVerified === "ikke verifisert";
    const custom = s.lastVerified === "egendefinert";
    html += `<div class="card"><div class="list-item-top"><span style="font-weight:500;font-size:13px;">${esc(s.code)}</span><span style="font-size:11px;color:${warn ? '#d97706' : custom ? '#2563eb' : 'var(--text-muted)'};">${custom ? t("addedManually") : warn ? t("shouldBeVerified") : t("verifiedOn") + " " + s.lastVerified}</span></div><div style="font-size:12px;color:var(--text-secondary);">${esc(stdTitle(s))} · ${t("edition")} ${esc(s.edition)}</div></div>`;
  });
  html += `<div class="section-title" style="margin-top:12px;">${t("directivesRegs")}</div>`;
  allDirectives().forEach(d => { html += `<div class="card"><span style="font-weight:500;">${esc(d.code)}</span> — ${esc(dirName(d))}</div>`; });
  html += `<div class="section-title" style="margin-top:12px;">${t("notifiedBodies")}</div>`;
  NOTIFIED_BODIES.forEach(n => { html += `<div class="card list-item-top"><span>${n.name}</span><span style="color:var(--text-muted);">${t("no")} ${n.ref}</span></div>`; });
  return html;
}

// ---------- Admin panel (visible only to ADMIN_UID) ----------
function adminLogAdd(msg, type) {
  adminLog = [{ msg, type: type || "ok", ts: new Date().toLocaleTimeString("no-NO") }, ...adminLog].slice(0, 50);
}
function loadAdminUsers() {
  adminLoading = true; render();
  _db.ref("docpilot").once("value").then(snap => {
    const raw = snap.val() || {};
    const shared = raw.shared || {};
    adminSharedStats = {
      customStdCount: (shared.customStandards || []).length,
      customDirCount: (shared.customDirectives || []).length,
      templateCount: (shared.templates || []).length,
    };
    adminUsers = Object.entries(raw).filter(([uid]) => uid !== "shared").map(([uid, val]) => ({
      uid,
      declCount: (val.declarations || []).length,
      rawData: val,
    }));
    adminLoading = false; adminUsersLoaded = true; render();
  }).catch(e => { adminLogAdd("Feil: " + e.message, "error"); adminLoading = false; adminUsersLoaded = true; render(); });
}
function adminViewUser(uid) { adminDetail = adminUsers.find(u => u.uid === uid) || null; render(); }
function adminDeleteUserData(uid) {
  if (!confirm(t("adminDeleteConfirm"))) return;
  _db.ref("docpilot/" + uid).remove().then(() => {
    adminLogAdd(t("adminDeletedLog") + " " + uid, "error");
    adminDetail = null;
    loadAdminUsers();
  }).catch(e => adminLogAdd("Feil: " + e.message, "error"));
}
function adminExportAll() {
  _db.ref("docpilot").once("value").then(snap => {
    const blob = new Blob([JSON.stringify({ docpilot: snap.val() || {}, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "docpilot-admin-export-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    adminLogAdd(t("adminExportedLog"), "ok");
    render();
  }).catch(e => adminLogAdd("Feil: " + e.message, "error"));
}
function renderAdmin() {
  const totalDecl = adminUsers.reduce((s, u) => s + u.declCount, 0);
  let html = `<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">${t("adminYouAreAdmin")}</div>`;

  if (adminDetail) {
    html += `<button class="btn btn-ghost" style="padding-left:0;" onclick="adminDetail=null; render()">${t("backToList")}</button>`;
    html += `<div class="card"><div style="font-size:12px;word-break:break-all;color:var(--text-muted);">UID: ${esc(adminDetail.uid)}</div>
      <div style="margin-top:6px;">${t("adminDeclarations")}: ${adminDetail.declCount}</div></div>`;
    html += `<button class="btn btn-primary" style="background:#dc2626;-webkit-text-fill-color:white;margin-top:8px;" onclick="adminDeleteUserData('${adminDetail.uid}')">${t("adminDeleteUserData")}</button>`;
    return html;
  }

  html += `<div class="section-title">${t("adminOverview")}</div>`;
  html += `<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
    <div class="card" style="flex:1;min-width:100px;"><div style="font-size:20px;font-weight:600;">${adminUsers.length}</div><div style="font-size:11px;color:var(--text-muted);">${t("adminUsers")}</div></div>
    <div class="card" style="flex:1;min-width:100px;"><div style="font-size:20px;font-weight:600;">${totalDecl}</div><div style="font-size:11px;color:var(--text-muted);">${t("adminDeclarations")}</div></div>
  </div>`;
  html += `<div class="card" style="margin-bottom:12px;"><div class="q-help" style="margin-bottom:4px;">${t("adminSharedLibraryStats")}</div>
    <div style="font-size:12px;">${t("favorites")}: ${adminSharedStats.templateCount} · ${t("standardsLower")}: ${adminSharedStats.customStdCount} · ${t("directivesLower")}: ${adminSharedStats.customDirCount}</div></div>`;
  html += `<button class="btn btn-ghost" onclick="loadAdminUsers()">${t("adminRefresh")}</button>
    <button class="btn btn-ghost" onclick="adminExportAll()">${t("adminExportAll")}</button>`;

  html += `<div class="section-title" style="margin-top:16px;">${t("adminUsers")}</div>`;
  if (adminLoading) html += `<div class="empty">${t("adminLoading")}</div>`;
  else if (adminUsers.length === 0) html += `<div class="empty">${t("adminNoUsers")}</div>`;
  else adminUsers.forEach(u => {
    html += `<button class="card card-btn" onclick="adminViewUser('${u.uid}')">
      <div style="font-size:12px;word-break:break-all;">${esc(u.uid)}</div>
      <div class="list-item-meta">${u.declCount} ${t("adminDeclarations").toLowerCase()}</div>
    </button>`;
  });

  if (adminLog.length > 0) {
    html += `<div class="section-title" style="margin-top:16px;">${t("adminLog")}</div>`;
    adminLog.forEach(l => {
      html += `<div class="card" style="font-size:11px;color:${l.type === 'error' ? '#dc2626' : l.type === 'warn' ? '#d97706' : 'var(--text-muted)'};">${l.ts} — ${esc(l.msg)}</div>`;
    });
  }
  return html;
}

// ---------- Main render ----------
function render() {
  if (!currentUser) {
    const el = document.getElementById("auth-shell");
    if (el) el.innerHTML = renderAuthScreen();
    return;
  }
  document.getElementById("logout-btn").textContent = t("logout");
  updateSupportBtnLabel();
  document.getElementById("app-lang-select").value = uiLang;
  document.getElementById("tabs").innerHTML = [["new",t("tabNew")],["list",t("tabList")],["library",t("tabLibrary")]]
    .concat(isAdmin ? [["admin","🛡 Admin"]] : [])
    .map(([id,label]) => `<button class="tab ${tab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`).join("");
  const content = document.getElementById("content");
  if (tab === "new") content.innerHTML = renderWizard();
  else if (tab === "list") content.innerHTML = renderList();
  else if (tab === "admin" && isAdmin) { content.innerHTML = renderAdmin(); if (!adminUsersLoaded && !adminLoading) loadAdminUsers(); }
  else content.innerHTML = renderLibrary();
}
function switchTab(id) { tab = id; viewing = null; render(); }

// ---------- Auth screen ----------
let authState = { mode: "login", email: "", pw: "", pw2: "", name: "", error: "", loading: false, info: "" };

const AUTH_ERR = {
  "auth/email-already-in-use": "E-post allerede i bruk.",
  "auth/weak-password": "Passordet er for kort (minst 6 tegn).",
  "auth/user-not-found": "Ingen konto med denne e-posten.",
  "auth/wrong-password": "Feil passord.",
  "auth/invalid-credential": "Feil e-post eller passord.",
  "auth/invalid-email": "Ugyldig e-postadresse.",
  "auth/too-many-requests": "For mange forsøk. Prøv igjen senere.",
  "auth/popup-closed-by-user": "Innlogging avbrutt.",
};
function authErrMsg(code) { return AUTH_ERR[code] || "Noe gikk galt. Prøv igjen."; }

function renderAuthScreen() {
  const s = authState;
  const langNames = { no: "NO", en: "EN", de: "DE", es: "ES", fr: "FR" };
  let html = `<div style="display:flex; justify-content:space-between; max-width:340px; margin:16px auto 0;">
    <select onchange="setUiLang(this.value)" style="width:auto; padding:4px 8px; font-size:12px; margin-bottom:0;">
      ${Object.keys(langNames).map(l => `<option value="${l}" ${uiLang === l ? "selected" : ""}>${langNames[l]}</option>`).join("")}
    </select>
    <button id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()">🌙</button></div>
    <div style="max-width:340px; margin:20px auto 0; text-align:center;">
    <svg width="64" height="64" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:12px;">
        <defs><linearGradient id="dpBlueAuth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#32B7FF"/><stop offset="1" stop-color="#1262E8"/></linearGradient></defs>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M256 34 430 99v141c0 112-68 193-174 238C150 433 82 352 82 240V99L256 34Z" stroke="url(#dpBlueAuth)" stroke-width="26"/>
        <path d="M163 132h123l68 68v171H163V132Z" stroke="currentColor" stroke-width="24"/>
        <path d="M286 133v67h67" stroke="currentColor" stroke-width="24"/>
        <path d="M208 241h96M208 290h91M208 339h60" stroke="currentColor" stroke-width="21"/>
        <circle cx="350" cy="365" r="84" fill="var(--bg)" stroke="url(#dpBlueAuth)" stroke-width="26"/>
        <path d="m307 365 32 32 58-69" stroke="url(#dpBlueAuth)" stroke-width="29"/>
      </g></svg>
    <div style="font-size:20px; font-weight:600;">DoC <span style="background:linear-gradient(135deg,#32B7FF,#1262E8); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;">Pilot</span></div>
    <div style="font-size:12px; color:#9ca3af; margin-bottom:24px;">${t("tagline")}</div>`;

  if (s.mode === "reset") {
    html += `<input placeholder="${t("email")}" value="${esc(s.email)}" oninput="authState.email=this.value">`;
    if (s.error) html += `<div style="color:#dc2626; font-size:12px; margin-bottom:8px;">${esc(s.error)}</div>`;
    if (s.info) html += `<div style="color:#16a34a; font-size:12px; margin-bottom:8px;">${esc(s.info)}</div>`;
    html += `<button class="btn btn-primary" style="width:100%;" onclick="authResetPw()" ${s.loading ? "disabled" : ""}>${t("sendReset")}</button>`;
    html += `<button class="btn btn-ghost" style="width:100%; margin-top:8px;" onclick="authState.mode='login'; authState.error=''; render()">${t("backToLogin")}</button>`;
  } else {
    html += `<button class="btn btn-primary" style="width:100%; margin-bottom:10px;" onclick="authGoogleLogin()" ${s.loading ? "disabled" : ""}>${t("google")}</button>
      <div style="font-size:11px; color:#9ca3af; margin:10px 0;">${t("or")}</div>
      <input placeholder="${t("email")}" value="${esc(s.email)}" oninput="authState.email=this.value">
      <input type="password" placeholder="${t("password")}" value="${esc(s.pw)}" oninput="authState.pw=this.value">`;
    if (s.mode === "register") {
      html += `<input placeholder="${t("name")}" value="${esc(s.name)}" oninput="authState.name=this.value">
        <input type="password" placeholder="${t("password2")}" value="${esc(s.pw2)}" oninput="authState.pw2=this.value">`;
    }
    if (s.error) html += `<div style="color:#dc2626; font-size:12px; margin:6px 0;">${esc(s.error)}</div>`;
    if (s.mode === "login") {
      html += `<button class="btn btn-blue" style="width:100%; margin-top:6px;" onclick="authEmailLogin()" ${s.loading ? "disabled" : ""}>${t("login")}</button>
        <div style="margin-top:12px; font-size:12px;">
          <a href="#" onclick="authState.mode='register'; authState.error=''; render(); return false;">${t("register")}</a>
          &nbsp;·&nbsp;
          <a href="#" onclick="authState.mode='reset'; authState.error=''; render(); return false;">${t("forgot")}</a>
        </div>`;
    } else {
      html += `<button class="btn btn-blue" style="width:100%; margin-top:6px;" onclick="authRegister()" ${s.loading ? "disabled" : ""}>${t("register")}</button>
        <div style="margin-top:12px; font-size:12px;"><a href="#" onclick="authState.mode='login'; authState.error=''; render(); return false;">${t("haveAccount")}</a></div>`;
    }
  }
  html += `</div>`;
  return html;
}

function authGoogleLogin() {
  authState.loading = true; authState.error = ""; render();
  _auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider())
    .catch(e => { authState.error = authErrMsg(e.code) + " (" + e.code + ")"; authState.loading = false; render(); });
}
function authEmailLogin() {
  authState.loading = true; authState.error = ""; render();
  _auth.signInWithEmailAndPassword(authState.email.trim(), authState.pw)
    .catch(e => { authState.error = authErrMsg(e.code); authState.loading = false; render(); });
}
function authRegister() {
  if (!authState.name.trim()) { authState.error = "Skriv inn navn."; render(); return; }
  if (authState.pw.length < 6) { authState.error = "Passordet må ha minst 6 tegn."; render(); return; }
  if (authState.pw !== authState.pw2) { authState.error = "Passordene er ikke like."; render(); return; }
  authState.loading = true; authState.error = ""; render();
  _auth.createUserWithEmailAndPassword(authState.email.trim(), authState.pw)
    .then(c => c.user.updateProfile({ displayName: authState.name.trim() }))
    .catch(e => { authState.error = authErrMsg(e.code); authState.loading = false; render(); });
}
function authResetPw() {
  if (!authState.email.trim()) { authState.error = "Skriv inn e-post."; render(); return; }
  authState.loading = true; authState.error = ""; render();
  _auth.sendPasswordResetEmail(authState.email.trim())
    .then(() => { authState.info = "Tilbakestillingslenke sendt!"; authState.mode = "login"; authState.loading = false; render(); })
    .catch(e => { authState.error = authErrMsg(e.code); authState.loading = false; render(); });
}

// ---------- Auth state → app bootstrap ----------
_auth.getRedirectResult().catch(e => { authState.error = authErrMsg(e.code); authState.loading = false; render(); });

_auth.onAuthStateChanged(user => {
  currentUser = user;
  isAdmin = !!(user && user.uid === ADMIN_UID);
  document.getElementById("boot-loading").style.display = "none";
  if (user) {
    document.getElementById("auth-shell").style.display = "none";
    document.getElementById("app-shell").style.display = "block";
    document.getElementById("user-email").textContent = user.email || user.displayName || "";
    Promise.all([
      _db.ref(userPath("declarations")).once("value"),
      _db.ref(sharedPath("customStandards")).once("value"),
      _db.ref(sharedPath("customDirectives")).once("value"),
      _db.ref(sharedPath("templates")).once("value"),
    ]).then(([declSnap, csSnap, cdSnap, tplSnap]) => {
      declarations = declSnap.val() || [];
      CUSTOM_STANDARDS = csSnap.val() || [];
      CUSTOM_DIRECTIVES = cdSnap.val() || [];
      TEMPLATES = tplSnap.val() || [];
      render();
    }).catch(e => {
      console.error("Kunne ikke hente data:", e);
      declarations = []; render();
    });
  } else {
    document.getElementById("app-shell").style.display = "none";
    document.getElementById("auth-shell").style.display = "block";
    document.getElementById("auth-shell").innerHTML = renderAuthScreen();
    adminUsersLoaded = false; adminUsers = []; adminDetail = null; adminLog = [];
  }
});
</script>
</body>
</html>
