<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; color: #111827; -webkit-text-fill-color: #111827; }
  html, body { background: #f9fafb !important; overflow-x: hidden; max-width: 100vw; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f9fafb;
    margin: 0;
    padding: 16px;
    color: #111827;
  }
  .wrap { max-width: 480px; margin: 0 auto; overflow-x: hidden; }
  h1 { font-size: 16px; font-weight: 500; margin: 0; }
  .sub { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  .tabs { display: flex; gap: 4px; background: #f3f4f6; border-radius: 8px; padding: 4px; margin: 16px 0; }
  .tab { flex: 1; text-align: center; font-size: 14px; padding: 6px 0; border-radius: 6px; border: none; background: transparent; color: #6b7280; cursor: pointer; }
  .tab.active { background: white; font-weight: 500; color: #111827; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #9ca3af; margin: 0 0 8px; }
  .card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
  .card-btn { display: block; width: 100%; text-align: left; cursor: pointer; }
  .card-btn:hover { border-color: #93c5fd; background: #eff6ff; }
  input, select { width: 100%; font-size: 14px; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px; font-family: inherit; }
  .btn { font-size: 14px; padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; }
  .btn-primary { background: #111827; color: white; -webkit-text-fill-color: white; flex: 1; }
  .btn-blue { background: #2563eb; color: white; -webkit-text-fill-color: white; flex: 1; }
  .btn-ghost { background: transparent; color: #6b7280; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .q-block { margin-bottom: 14px; }
  .q-text { font-size: 14px; color: #374151; margin-bottom: 4px; }
  .q-help { font-size: 12px; color: #9ca3af; margin-bottom: 6px; line-height: 1.5; }
  .bool-row { display: flex; gap: 8px; }
  .bool-btn { flex: 1; padding: 7px 0; border-radius: 6px; border: 1px solid #e5e7eb; background: white; font-size: 14px; cursor: pointer; }
  .bool-btn.selected { background: #2563eb; color: white; -webkit-text-fill-color: white; border-color: #2563eb; }
  .progress { display: flex; gap: 4px; margin-bottom: 20px; }
  .progress div { height: 4px; flex: 1; border-radius: 2px; background: #e5e7eb; }
  .progress div.active { background: #3b82f6; }
  .checkbox-row { position: relative; display: block; font-size: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; padding: 9px 10px 9px 34px; margin-bottom: 6px; }
  .checkbox-row input { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; margin: 0; }
  .checkbox-row span { display: block; overflow-wrap: break-word; word-break: break-word; }
  .card, .card-btn, .list-item-name, .q-text, .q-help { overflow-wrap: break-word; word-break: break-word; }
  .checkbox-row .sub { font-size: 11px; color: #9ca3af; margin-top: 1px; }
  .pill { display: inline-block; background: #eff6ff; color: #1e40af; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin: 0 4px 4px 0; }
  .doc-card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; font-size: 13px; line-height: 1.5; max-width: 420px; margin: 0 auto; }
  .doc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .doc-title { text-align: center; font-size: 14px; font-weight: 500; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 12px; }
  .doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .doc-box { background: #f9fafb; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .doc-label { font-size: 10px; color: #9ca3af; margin-bottom: 2px; }
  .doc-disclaimer { font-size: 10px; color: #9ca3af; border-top: 1px dashed #e5e7eb; border-bottom: 1px dashed #e5e7eb; padding: 8px 0; margin-bottom: 10px; }
  .doc-sign { display: flex; justify-content: space-between; align-items: flex-end; }
  .sign-line { width: 80px; height: 32px; border-bottom: 1px solid #d1d5db; }
  .lang-toggle { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 10px; }
  .lang-btn { font-size: 11px; padding: 4px 12px; border-radius: 6px; border: 1px solid #e5e7eb; background: white; cursor: pointer; }
  .lang-btn.active { background: #f3f4f6; }
  .print-btn { font-size: 11px; padding: 4px 12px; border-radius: 6px; border: none; background: #111827; color: white; -webkit-text-fill-color: white; cursor: pointer; }
  .empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 40px 0; }
  .list-item-top { display: flex; justify-content: space-between; align-items: center; }
  .list-item-name { font-size: 14px; font-weight: 500; }
  .list-item-meta { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .search-result { display: block; width: 100%; text-align: left; font-size: 12px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 10px; margin-bottom: 4px; cursor: pointer; }
  .warn { font-size: 12px; color: #d97706; margin-top: 4px; }
  @media print {
    .no-print { display: none !important; }
    body { background: white; padding: 0; }
    .doc-card { border: none; max-width: 100%; }
  }
</style>
</head>

<div id="boot-loading" style="display:flex; align-items:center; justify-content:center; height:100vh; font-size:13px; color:#9ca3af;">Laster…</div>
<div class="wrap" id="auth-shell" style="display:none;"></div>
<div class="wrap" id="app-shell" style="display:none;">

let wz = { step: 1, categoryId: "", answers: {}, directiveIds: [], standardIds: [], addSearch: "",
  details: { manufacturerName: "", manufacturerAddress: "", techFileCompiler: "", techFileAddress: "", productName: "", serial: "", object: "", exMarking: "", notifiedBodyId: "", certNumber: "", signatoryName: "", signatoryRole: "", place: "" },
  lang: "no" };

function userPath(sub) { return "docpilot/" + currentUser.uid + "/" + sub; }
function persist() {
  if (!currentUser) return;
  _db.ref(userPath("declarations")).set(declarations).catch(e => console.error("Lagring feilet:", e));
}
function persistCustomLibrary() {
  if (!currentUser) return;
  _db.ref(userPath("customStandards")).set(CUSTOM_STANDARDS).catch(e => console.error(e));
  _db.ref(userPath("customDirectives")).set(CUSTOM_DIRECTIVES).catch(e => console.error(e));
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

function suggestFor(categoryId, answers) {
  const directiveIds = new Set(), standardIds = new Set();
  RULES.forEach(r => {
    const catMatch = r.category === null || r.category === categoryId;
    const attrMatch = r.attr === null || answers[r.attr] === r.value;
    if (catMatch && attrMatch) r.suggests.forEach(s => (s.type === "directive" ? directiveIds : standardIds).add(s.id));
  });
  return { directiveIds: [...directiveIds], standardIds: [...standardIds] };
}

function newDocNumber() { return "DoC-2026-" + String(declarations.length + 143).padStart(4, "0"); }

function resetWizard() {
  wz = { step: 1, categoryId: "", answers: {}, directiveIds: [], standardIds: [], addSearch: "",
    details: { manufacturerName: "", manufacturerAddress: "", techFileCompiler: "", techFileAddress: "", productName: "", serial: "", object: "", exMarking: "", notifiedBodyId: "", certNumber: "", signatoryName: "", signatoryRole: "", place: "" },
    lang: "no" };
}

// ---------- Document renderer ----------
function renderDoc(decl, lang, opts) {
  opts = opts || {};
  const t = T[lang];
  const directives = decl.directiveIds.map(id => findDirective(id)).filter(Boolean);
  const standards = decl.standardIds.map(id => findStandard(id)).filter(Boolean);
  const nb = decl.notifiedBody;
  const isAtex = decl.directiveIds.includes("atex");
  return `
    <div class="lang-toggle no-print">
      <button class="lang-btn ${lang === 'no' ? 'active' : ''}" onclick="${opts.onLang}('no')">Norsk</button>
      <button class="lang-btn ${lang === 'en' ? 'active' : ''}" onclick="${opts.onLang}('en')">English</button>
      <button class="print-btn" onclick="window.print()">Skriv ut / lagre som PDF</button>
    </div>
    <div class="doc-card">
      <div style="display:flex; gap:10px; margin-bottom:12px;">
        ${decl.logo ? `<img src="${decl.logo}" style="width:64px; align-self:stretch; object-fit:cover; border-radius:4px; flex-shrink:0;">` : ""}
        <div style="flex:1; min-width:0;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:500;">${esc(decl.manufacturerName) || "—"}</span>
            <span style="font-size:11px;color:#9ca3af;">${esc(decl.docNumber)}</span>
          </div>
          <div class="doc-title" style="margin-top:8px;">${t.title}</div>
          <div class="${isAtex ? 'doc-grid' : ''}">
            <div class="doc-box"><div class="doc-label">${t.product}</div><div style="font-weight:500;">${esc(decl.productName) || "—"}</div>${decl.idType !== "type-only" && decl.serial ? `<div style="font-size:11px;color:#6b7280;">${decl.idType === "batch" ? "Batch" : "S/N"} ${esc(decl.serial)}</div>` : ""}</div>
            ${isAtex ? `<div class="doc-box"><div class="doc-label">${t.ex}</div><div style="font-weight:500;">${esc(decl.exMarking) || "—"}</div></div>` : ""}
          </div>
        </div>
      </div>
      <div class="doc-box">
        <div class="doc-label">${t.manufacturer}</div>
        <div>${esc(decl.manufacturerName) || "—"}${decl.manufacturerAddress ? ", " + esc(decl.manufacturerAddress) : ""}</div>
        <div style="font-size:11px;color:#9ca3af;margin-top:4px;">${t.object}: ${esc(decl.object) || "—"}</div>
        ${(decl.directiveIds.includes("machine") || decl.directiveIds.includes("machine-reg")) && decl.techFileCompiler ? `<div style="font-size:11px;color:#9ca3af;margin-top:4px;">${t.techFile}: ${esc(decl.techFileCompiler)}${decl.techFileAddress ? ", " + esc(decl.techFileAddress) : ""}</div>` : ""}
        <div style="margin-top:6px;padding-top:6px;border-top:1px solid #e5e7eb;font-size:11px;color:#6b7280;font-style:italic;">${t.sole(decl.manufacturerName || "—")}</div>
      </div>
      <div class="doc-box">
        <div class="doc-label">${t.conformity}</div>
        <div style="margin-bottom:4px;">${directives.map(d => `<span class="pill">${d.code}</span>`).join("")}</div>
        <div style="font-size:11px;color:#6b7280;">${t.standards}: ${standards.map(s => s.code).join(" · ") || "—"}</div>
      </div>
      ${nb
        ? `<div class="doc-box"><div class="doc-label">${t.nb}</div><div style="display:flex;justify-content:space-between;">${esc(nb.name)}<span style="color:#6b7280;">Nr. ${esc(nb.ref)}</span></div><div style="font-size:11px;color:#9ca3af;margin-top:2px;">${esc(decl.certNumber) || "—"}</div></div>`
        : ""}
      <div class="doc-disclaimer">${t.disclaimer(decl.manufacturerName || "—")}</div>
      <div class="doc-sign">
        <div>
          <div style="font-size:11px;color:#9ca3af;">${esc(decl.place || "Bergen")}, ${esc(decl.date)}</div>
          <div style="margin-top:14px;font-size:12px;">${esc(decl.signatoryName) || "—"}</div>
          <div style="font-size:11px;color:#6b7280;">${esc(decl.signatoryRole) || "—"}</div>
        </div>
        <div class="sign-line"></div>
      </div>
    </div>`;
}

// ---------- Wizard renderer ----------
function relevantAttrs() {
  const ids = CATEGORY_ATTRIBUTES[wz.categoryId] || [];
  return ATTRIBUTES.filter(a => ids.includes(a.id)).filter(a => !a.dependsOn || wz.answers[a.dependsOn.attr] === a.dependsOn.value);
}

function showNb() { return wz.answers.atex === true && wz.answers.atexGroup === "II2G"; }

function renderWizard() {
  let html = `<div class="progress">${[1,2,3,4,5].map(n => `<div class="${wz.step >= n ? 'active' : ''}"></div>`).join("")}</div>`;

  if (wz.step === 1) {
    html += `<div class="section-title">1. Velg utstyrskategori</div>`;
    CATEGORIES.forEach(c => {
      html += `<button class="card card-btn" onclick="selectCategory('${c.id}')">${esc(c.name)}</button>`;
    });
  }

  if (wz.step === 2) {
    const cat = CATEGORIES.find(c => c.id === wz.categoryId);
    html += `<div class="section-title">2. Kontrollspørsmål — ${esc(cat.name)}</div>`;
    const attrs = relevantAttrs();
    if (attrs.length === 0) html += `<div style="font-size:13px;color:#9ca3af;margin-bottom:12px;">Ingen kategorispesifikke spørsmål. Universalsettet (EN ISO 12100 m.fl.) foreslås direkte.</div>`;
    attrs.forEach(a => {
      html += `<div class="q-block"><div class="q-text">${esc(a.question)}</div>`;
      if (a.help) html += `<div class="q-help">${esc(a.help)}</div>`;
      if (a.type === "bool") {
        html += `<div class="bool-row">
          <button class="bool-btn ${wz.answers[a.id] === true ? 'selected' : ''}" onclick="answerBool('${a.id}', true)">Ja</button>
          <button class="bool-btn ${wz.answers[a.id] === false ? 'selected' : ''}" onclick="answerBool('${a.id}', false)">Nei</button>
        </div>`;
      } else {
        html += `<select onchange="answerSelect('${a.id}', this.value)">
          <option value="">Velg…</option>
          ${a.options.map(o => `<option value="${o.value}" ${wz.answers[a.id] === o.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}
        </select>`;
      }
      html += `</div>`;
    });
    html += `<div class="row"><button class="btn btn-ghost" onclick="goStep(1)">Tilbake</button>
      <button class="btn btn-primary" onclick="runSuggest()">Foreslå direktiver og standarder</button></div>`;
  }

  if (wz.step === 3) {
    html += `<div class="section-title">3. Foreslått startpunkt</div><div class="section-title">DIREKTIVER</div>`;
    allDirectives().forEach(d => {
      const checked = wz.directiveIds.includes(d.id);
      html += `<label class="checkbox-row"><input type="checkbox" ${checked ? "checked" : ""} onchange="toggleDirective('${d.id}')"><span>${d.code} — ${esc(d.name)}</span></label>`;
    });
    html += `<button class="search-result" onclick="wz.showAddDirective=!wz.showAddDirective; render()">${wz.showAddDirective ? "− Lukk" : "+ Legg til eget direktiv (finnes ikke i listen)"}</button>`;
    if (wz.showAddDirective) {
      html += `<input placeholder="Kode (f.eks. 2011/65/EU)" value="${esc(wz.newDirectiveCode || "")}" oninput="wz.newDirectiveCode=this.value">`;
      html += `<input placeholder="Navn (f.eks. RoHS)" value="${esc(wz.newDirectiveName || "")}" oninput="wz.newDirectiveName=this.value">`;
      html += `<button class="btn btn-ghost" style="width:100%;text-align:left;padding-left:0;" onclick="addCustomDirective()">Legg til direktiv</button>`;
    }

    html += `<div class="section-title" style="margin-top:12px;">STANDARDER</div>`;
    allStandards().filter(s => wz.standardIds.includes(s.id)).forEach(s => {
      html += `<label class="checkbox-row"><input type="checkbox" checked onchange="toggleStandard('${s.id}')"><span>${s.code} — ${esc(s.title)}<div class="sub">Utgave ${s.edition} · sist verifisert ${s.lastVerified}</div></span></label>`;
    });
    html += `<input id="standard-search-input" placeholder="Søk i standardbibliotek for å legge til flere…" value="${esc(wz.addSearch)}" oninput="updateStandardSearch(this.value)">`;
    html += `<div id="standard-search-results">${renderStandardSearchResults()}</div>`;
    html += `<button class="search-result" onclick="wz.showAddStandard=!wz.showAddStandard; render()">${wz.showAddStandard ? "− Lukk" : "+ Legg til egen standard (finnes ikke i biblioteket)"}</button>`;
    if (wz.showAddStandard) {
      html += `<input placeholder="Kode (f.eks. EN 1090-1)" value="${esc(wz.newStandardCode || "")}" oninput="wz.newStandardCode=this.value">`;
      html += `<input placeholder="Tittel" value="${esc(wz.newStandardTitle || "")}" oninput="wz.newStandardTitle=this.value">`;
      html += `<input placeholder="Utgave (f.eks. 2018)" value="${esc(wz.newStandardEdition || "")}" oninput="wz.newStandardEdition=this.value">`;
      html += `<button class="btn btn-ghost" style="width:100%;text-align:left;padding-left:0;" onclick="addCustomStandard()">Legg til standard</button>`;
    }
    html += `<div class="row"><button class="btn btn-ghost" onclick="goStep(2)">Tilbake</button>
      <button class="btn btn-primary" onclick="goStep(4)">Neste — produktdata</button></div>`;
  }

  if (wz.step === 4) {
    html += `<div class="section-title">4. Produsent-, produkt- og signaturdata</div>`;
    html += `<div class="q-block"><div class="q-text">Logo (valgfritt)</div>`;
    if (wz.details.logo) {
      html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;"><img src="${wz.details.logo}" style="max-height:40px;max-width:160px;object-fit:contain;"><button class="btn btn-ghost" style="padding:4px 10px;" onclick="wz.details.logo=''; render()">Fjern</button></div>`;
    } else {
      html += `<input type="file" accept="image/*" onchange="handleLogoUpload(this)" style="border:1px dashed #e5e7eb;padding:10px;">`;
    }
    html += `</div>`;
    html += field("manufacturerName", "Produsentens navn");
    html += field("manufacturerAddress", "Produsentens adresse");
    if (wz.directiveIds.includes("machine") || wz.directiveIds.includes("machine-reg")) {
      html += `<div class="q-help" style="margin-bottom:8px;">Maskindirektivet krever navn og adresse på personen som er autorisert til å sammenstille teknisk fil — denne personen må være etablert i EØS. Kan være samme person som signerer, eller en annen.</div>`;
      html += field("techFileCompiler", "Teknisk fil oppbevares av — navn");
      html += field("techFileAddress", "Teknisk fil oppbevares av — adresse (EØS)");
    }
    html += field("productName", "Produktmodell / type");
    html += `<select onchange="wz.details.idType=this.value; render()" style="margin-bottom:8px;">
      <option value="serial" ${wz.details.idType !== "batch" && wz.details.idType !== "type-only" ? "selected" : ""}>Identifiseres med: serienummer</option>
      <option value="batch" ${wz.details.idType === "batch" ? "selected" : ""}>Identifiseres med: batchnummer</option>
      <option value="type-only" ${wz.details.idType === "type-only" ? "selected" : ""}>Identifiseres med: kun type/modell (serieprodusert, identiske enheter)</option>
    </select>`;
    if (wz.details.idType !== "type-only") {
      html += field("serial", wz.details.idType === "batch" ? "Batchnummer" : "Serienummer");
    }
    html += field("object", "Objekt (kort beskrivelse for sporbarhet)");
    html += field("exMarking", "Ex-merking (f.eks. II 2G Ex db IIB T4 Gb)");
    if (showNb()) {
      html += `<select onchange="wz.details.notifiedBodyId=this.value">
        <option value="">Velg Notified Body…</option>
        ${NOTIFIED_BODIES.map(n => `<option value="${n.id}" ${wz.details.notifiedBodyId === n.id ? "selected" : ""}>${n.name} (${n.ref})</option>`).join("")}
      </select>`;
      html += field("certNumber", "Sertifikatnummer");
    }
    html += field("signatoryName", "Signatar — navn");
    html += field("signatoryRole", "Signatar — funksjon");
    html += field("place", "Sted");
    html += `<div class="row"><button class="btn btn-ghost" onclick="goStep(3)">Tilbake</button>
      <button class="btn btn-primary" onclick="goStep(5)">Forhåndsvis</button></div>`;
  }

  if (wz.step === 5) {
    html += `<div class="section-title">5. Forhåndsvisning</div>`;
    const decl = { docNumber: newDocNumber(), directiveIds: wz.directiveIds, standardIds: wz.standardIds,
      notifiedBody: showNb() && wz.details.notifiedBodyId ? NOTIFIED_BODIES.find(n => n.id === wz.details.notifiedBodyId) : null,
      date: new Date().toLocaleDateString("no-NO"), ...wz.details };
    html += renderDoc(decl, wz.lang, { onLang: "setWizardLang" });
    html += `<div class="row" style="max-width:420px;margin-left:auto;margin-right:auto;">
      <button class="btn btn-ghost" onclick="goStep(4)">Tilbake</button>
      <button class="btn btn-blue" onclick="saveDeclaration()">Lagre som utkast</button></div>`;
  }

  if (wz.step === 5.5) {
    html += `<div class="empty">Erklæringen er lagret som utkast.<br><br>
      <button class="btn btn-primary" style="max-width:200px;" onclick="resetWizard(); render()">Ny erklæring</button></div>`;
  }

  return html;
}

function field(key, placeholder) {
  return `<input placeholder="${placeholder}" value="${esc(wz.details[key])}" oninput="wz.details.${key}=this.value">`;
}

// ---------- Event handlers (wizard) ----------
function selectCategory(id) { wz.categoryId = id; wz.answers = {}; wz.step = 2; render(); }
function handleLogoUpload(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { wz.details.logo = e.target.result; render(); };
  reader.readAsDataURL(file);
}
function goStep(n) { wz.step = n; render(); }
function answerBool(id, val) { wz.answers[id] = val; render(); }
function answerSelect(id, val) { wz.answers[id] = val; render(); }
function runSuggest() {
  const s = suggestFor(wz.categoryId, wz.answers);
  wz.directiveIds = s.directiveIds; wz.standardIds = s.standardIds; wz.step = 3; render();
}
function toggleDirective(id) { wz.directiveIds = wz.directiveIds.includes(id) ? wz.directiveIds.filter(x => x !== id) : [...wz.directiveIds, id]; render(); }
function toggleStandard(id) { wz.standardIds = wz.standardIds.includes(id) ? wz.standardIds.filter(x => x !== id) : [...wz.standardIds, id]; render(); }
function renderStandardSearchResults() {
  if (!wz.addSearch) return "";
  const results = allStandards().filter(s => !wz.standardIds.includes(s.id) && (s.code.toLowerCase().includes(wz.addSearch.toLowerCase()) || s.title.toLowerCase().includes(wz.addSearch.toLowerCase())));
  let html = "";
  results.slice(0, 4).forEach(s => {
    html += `<button class="search-result" onclick="addStandard('${s.id}')">+ ${esc(s.code)} — ${esc(s.title)}</button>`;
  });
  if (results.length === 0) {
    html += `<div style="font-size:12px;color:#9ca3af;margin-bottom:6px;">Ingen treff i biblioteket. Bruk "Legg til egen standard" under.</div>`;
  }
  return html;
}
function updateStandardSearch(value) {
  wz.addSearch = value;
  const el = document.getElementById("standard-search-results");
  if (el) el.innerHTML = renderStandardSearchResults();
}
function addStandard(id) { wz.standardIds.push(id); render(); }
function addCustomStandard() {
  if (!wz.newStandardCode) return;
  const id = "custom-" + Date.now();
  CUSTOM_STANDARDS.push({ id, code: wz.newStandardCode, title: wz.newStandardTitle || "", edition: wz.newStandardEdition || "—", lastVerified: "egendefinert" });
  wz.standardIds.push(id);
  wz.newStandardCode = ""; wz.newStandardTitle = ""; wz.newStandardEdition = ""; wz.showAddStandard = false;
  persistCustomLibrary();
  render();
}
function addCustomDirective() {
  if (!wz.newDirectiveCode) return;
  const id = "custom-" + Date.now();
  CUSTOM_DIRECTIVES.push({ id, code: wz.newDirectiveCode, name: wz.newDirectiveName || "" });
  wz.directiveIds.push(id);
  wz.newDirectiveCode = ""; wz.newDirectiveName = ""; wz.showAddDirective = false;
  persistCustomLibrary();
  render();
}
function setWizardLang(l) { wz.lang = l; render(); }
function saveDeclaration() {
  const decl = { id: "d" + Date.now(), docNumber: newDocNumber(), categoryId: wz.categoryId,
    directiveIds: wz.directiveIds, standardIds: wz.standardIds,
    notifiedBody: showNb() && wz.details.notifiedBodyId ? NOTIFIED_BODIES.find(n => n.id === wz.details.notifiedBodyId) : null,
    date: new Date().toLocaleDateString("no-NO"), status: "utkast", ...wz.details };
  declarations = [decl, ...declarations];
  persist();
  wz.step = 5.5; render();
}

// ---------- List & library ----------
function renderList() {
  if (viewing) {
    const decl = declarations.find(d => d.id === viewing);
    return `<button class="btn btn-ghost no-print" style="padding-left:0;" onclick="viewing=null; render()">← Tilbake til listen</button>` +
      renderDoc(decl, viewLang, { onLang: "setViewLang" });
  }
  if (declarations.length === 0) return `<div class="empty">Ingen erklæringer lagret ennå.</div>`;
  return declarations.map(d => `
    <button class="card card-btn" onclick="viewing='${d.id}'; render()">
      <div class="list-item-top"><span class="list-item-name">${esc(d.productName) || "Uten navn"}</span><span style="font-size:11px;color:#9ca3af;">${esc(d.docNumber)}</span></div>
      <div class="list-item-meta">${esc(d.date)} · ${esc(d.status)} · ${d.directiveIds.length} direktiv, ${d.standardIds.length} standarder</div>
    </button>`).join("");
}
function setViewLang(l) { viewLang = l; render(); }

function renderLibrary() {
  let html = `<div class="section-title">Standardbibliotek</div>`;
  allStandards().forEach(s => {
    const warn = s.lastVerified === "ikke verifisert";
    const custom = s.lastVerified === "egendefinert";
    html += `<div class="card"><div class="list-item-top"><span style="font-weight:500;font-size:13px;">${esc(s.code)}</span><span style="font-size:11px;color:${warn ? '#d97706' : custom ? '#2563eb' : '#9ca3af'};">${custom ? "lagt til manuelt" : warn ? "bør verifiseres" : "verifisert " + s.lastVerified}</span></div><div style="font-size:12px;color:#6b7280;">${esc(s.title)} · utgave ${esc(s.edition)}</div></div>`;
  });
  html += `<div class="section-title" style="margin-top:12px;">Direktiver / forordninger</div>`;
  allDirectives().forEach(d => { html += `<div class="card"><span style="font-weight:500;">${esc(d.code)}</span> — ${esc(d.name)}</div>`; });
  html += `<div class="section-title" style="margin-top:12px;">Notified bodies</div>`;
  NOTIFIED_BODIES.forEach(n => { html += `<div class="card list-item-top"><span>${n.name}</span><span style="color:#9ca3af;">Nr. ${n.ref}</span></div>`; });
  return html;
}

// ---------- Main render ----------
function render() {
  if (!currentUser) {
    const el = document.getElementById("auth-shell");
    if (el) el.innerHTML = renderAuthScreen();
    return;
  }
  document.getElementById("tabs").innerHTML = [["new","Ny"],["list","Erklæringer"],["library","Bibliotek"]]
    .map(([id,label]) => `<button class="tab ${tab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`).join("");
  const content = document.getElementById("content");
  if (tab === "new") content.innerHTML = renderWizard();
  else if (tab === "list") content.innerHTML = renderList();
  else content.innerHTML = renderLibrary();
}
function switchTab(id) { tab = id; viewing = null; render(); }

// ---------- Auth screen ----------
let authState = { mode: "login", email: "", pw: "", pw2: "", name: "", error: "", loading: false, info: "" };

const AUTH_ERR = {
  "auth/email-already-in-use": "E-post allerede i bruk.",
  "auth/weak-password": "Passordet er for kort (minst 6 tegn).",
  "auth/user-not-found": "Ingen konto med denne e-posten.",
  "auth/wrong-password": "Feil passord.",
  "auth/invalid-credential": "Feil e-post eller passord.",
  "auth/invalid-email": "Ugyldig e-postadresse.",
  "auth/too-many-requests": "For mange forsøk. Prøv igjen senere.",
  "auth/popup-closed-by-user": "Innlogging avbrutt.",
};
function authErrMsg(code) { return AUTH_ERR[code] || "Noe gikk galt. Prøv igjen."; }

function renderAuthScreen() {
  const s = authState;
  let html = `<div style="max-width:340px; margin:60px auto 0; text-align:center;">
    <svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:12px;">
      <defs>
        <linearGradient id="logoBgAuth" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1e3a5f"/>
          <stop offset="100%" stop-color="#0a1220"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" rx="22" fill="url(#logoBgAuth)"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.55"/>
      <circle cx="50" cy="50" r="3" fill="#ffffff"/>
      <path d="M50 24 L58 46 L50 50 L42 46 Z" fill="#ffffff"/>
      <path d="M50 76 L42 46 L50 50 Z" fill="#3b82f6"/>
      <path d="M50 76 L58 46 L50 50 Z" fill="#3b82f6"/>
    </svg>
    <div style="font-size:20px; font-weight:600;">DoC Pilot</div>
    <div style="font-size:12px; color:#9ca3af; margin-bottom:24px;">The Road to Compliance</div>`;

  if (s.mode === "reset") {
    html += `<input placeholder="E-post" value="${esc(s.email)}" oninput="authState.email=this.value">`;
    if (s.error) html += `<div style="color:#dc2626; font-size:12px; margin-bottom:8px;">${esc(s.error)}</div>`;
    if (s.info) html += `<div style="color:#16a34a; font-size:12px; margin-bottom:8px;">${esc(s.info)}</div>`;
    html += `<button class="btn btn-primary" style="width:100%;" onclick="authResetPw()" ${s.loading ? "disabled" : ""}>Send tilbakestillingslenke</button>`;
    html += `<button class="btn btn-ghost" style="width:100%; margin-top:8px;" onclick="authState.mode='login'; authState.error=''; render()">Tilbake til innlogging</button>`;
  } else {
    html += `<button class="btn btn-primary" style="width:100%; margin-bottom:10px;" onclick="authGoogleLogin()" ${s.loading ? "disabled" : ""}>Fortsett med Google</button>
      <div style="font-size:11px; color:#9ca3af; margin:10px 0;">— eller —</div>
      <input placeholder="E-post" value="${esc(s.email)}" oninput="authState.email=this.value">
      <input type="password" placeholder="Passord" value="${esc(s.pw)}" oninput="authState.pw=this.value">`;
    if (s.mode === "register") {
      html += `<input placeholder="Navn" value="${esc(s.name)}" oninput="authState.name=this.value">
        <input type="password" placeholder="Gjenta passord" value="${esc(s.pw2)}" oninput="authState.pw2=this.value">`;
    }
    if (s.error) html += `<div style="color:#dc2626; font-size:12px; margin:6px 0;">${esc(s.error)}</div>`;
    if (s.mode === "login") {
      html += `<button class="btn btn-blue" style="width:100%; margin-top:6px;" onclick="authEmailLogin()" ${s.loading ? "disabled" : ""}>Logg inn</button>
        <div style="margin-top:12px; font-size:12px;">
          <a href="#" onclick="authState.mode='register'; authState.error=''; render(); return false;">Opprett konto</a>
          &nbsp;·&nbsp;
          <a href="#" onclick="authState.mode='reset'; authState.error=''; render(); return false;">Glemt passord?</a>
        </div>`;
    } else {
      html += `<button class="btn btn-blue" style="width:100%; margin-top:6px;" onclick="authRegister()" ${s.loading ? "disabled" : ""}>Opprett konto</button>
        <div style="margin-top:12px; font-size:12px;"><a href="#" onclick="authState.mode='login'; authState.error=''; render(); return false;">Har allerede konto? Logg inn</a></div>`;
    }
  }
  html += `</div>`;
  return html;
}

function authGoogleLogin() {
  authState.loading = true; authState.error = ""; render();
  _auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(e => { authState.error = authErrMsg(e.code); authState.loading = false; render(); });
}
function authEmailLogin() {
  authState.loading = true; authState.error = ""; render();
  _auth.signInWithEmailAndPassword(authState.email.trim(), authState.pw)
    .catch(e => { authState.error = authErrMsg(e.code); authState.loading = false; render(); });
}
function authRegister() {
  if (!authState.name.trim()) { authState.error = "Skriv inn navn."; render(); return; }
  if (authState.pw.length < 6) { authState.error = "Passordet må ha minst 6 tegn."; render(); return; }
  if (authState.pw !== authState.pw2) { authState.error = "Passordene er ikke like."; render(); return; }
  authState.loading = true; authState.error = ""; render();
  _auth.createUserWithEmailAndPassword(authState.email.trim(), authState.pw)
    .then(c => c.user.updateProfile({ displayName: authState.name.trim() }))
    .catch(e => { authState.error = authErrMsg(e.code); authState.loading = false; render(); });
}
function authResetPw() {
  if (!authState.email.trim()) { authState.error = "Skriv inn e-post."; render(); return; }
  authState.loading = true; authState.error = ""; render();
  _auth.sendPasswordResetEmail(authState.email.trim())
    .then(() => { authState.info = "Tilbakestillingslenke sendt!"; authState.mode = "login"; authState.loading = false; render(); })
    .catch(e => { authState.error = authErrMsg(e.code); authState.loading = false; render(); });
}

// ---------- Auth state → app bootstrap ----------
_auth.onAuthStateChanged(user => {
  currentUser = user;
  document.getElementById("boot-loading").style.display = "none";
  if (user) {
    document.getElementById("auth-shell").style.display = "none";
    document.getElementById("app-shell").style.display = "block";
    document.getElementById("user-email").textContent = user.email || user.displayName || "";
    Promise.all([
      _db.ref(userPath("declarations")).once("value"),
      _db.ref(userPath("customStandards")).once("value"),
      _db.ref(userPath("customDirectives")).once("value"),
    ]).then(([declSnap, csSnap, cdSnap]) => {
      declarations = declSnap.val() || [];
      CUSTOM_STANDARDS = csSnap.val() || [];
      CUSTOM_DIRECTIVES = cdSnap.val() || [];
      render();
    }).catch(e => {
      console.error("Kunne ikke hente data:", e);
      declarations = []; render();
    });
  } else {
    document.getElementById("app-shell").style.display = "none";
    document.getElementById("auth-shell").style.display = "block";
    document.getElementById("auth-shell").innerHTML = renderAuthScreen();
  }
});
</script>
</body>
</html>
